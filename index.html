<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#202020">

<title>SpotiMeer</title>
<link rel="icon" href="Icon.jpg">

<style>

/* GLOBAL */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    scroll-behavior: smooth;
}

body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

/* APP CONTAINER */
.app {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.5vw, 14px);

    padding:
        calc(12px + env(safe-area-inset-top))
        calc(15px + env(safe-area-inset-right))
        12px
        calc(15px + env(safe-area-inset-left));

    background: #202020;
    border-bottom: 1px solid #303030;
}

/* APP ICON */
.app-icon {
    width: clamp(38px, 11vw, 48px);
    height: clamp(38px, 11vw, 48px);
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
}

/* APP NAME */
.app-name {
    color: #1ed760;
    font-size: clamp(20px, 5.5vw, 27px);
    font-weight: bold;
    overflow-wrap: anywhere;
}

/* MAIN CONTENT */
main {
    flex: 1;
    width: 100%;
    padding: clamp(15px, 4vw, 25px);

    padding-bottom:
        calc(25px + env(safe-area-inset-bottom));

    background: linear-gradient(
        180deg,
        #252525 0%,
        #181818 35%,
        #121212 100%
    );
}

/* MUSIC TITLE CARD */
.music-item {
    width: 100%;
    max-width: 100%;
    background: #282828;
    border-radius: 12px;
    padding: clamp(14px, 4vw, 20px);
    border: 1px solid #353535;
    margin-bottom: 25px;
}

/* MUSIC TITLE */
.music-title {
    font-size: clamp(14px, 4vw, 18px);
    font-weight: bold;
    color: #ffffff;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

/* MUSIC DURATION */
.music-duration {
    color: #b3b3b3;
    font-size: clamp(12px, 3.5vw, 14px);
    margin-top: 8px;
    line-height: 1.5;
}

/* FILE SIZE */
.music-size {
    color: #b3b3b3;
    font-size: clamp(12px, 3.5vw, 14px);
    margin-top: 8px;
    line-height: 1.5;
}

/* DOWNLOAD BUTTON */
.download-btn {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    background: #1ed760;
    color: #121212;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.2s;
}

.download-btn:hover {
    background: #1fdf64;
    transform: scale(1.01);
}

.download-btn:active {
    transform: scale(0.98);
}

/* INCLUDED SONGS TITLE */
.section-title {
    font-size: clamp(19px, 5vw, 24px);
    font-weight: bold;
    color: #1ed760;
    margin-bottom: 15px;
}

/* SONG LIST */
.song-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* SONG CARD */
.song-item {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #242424;
    border: 1px solid #303030;
    border-radius: 10px;
    padding: 14px 15px;
    min-height: 55px;
}

/* SONG NUMBER */
.song-number {
    color: #1ed760;
    font-size: 14px;
    font-weight: bold;
    min-width: 25px;
    flex-shrink: 0;
}

/* SONG NAME */
.song-name {
    color: #eeeeee;
    font-size: clamp(13px, 3.8vw, 16px);
    line-height: 1.5;
    overflow-wrap: anywhere;
}

/* LOADING SCREEN */
.loading-screen {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.96);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
    padding: 25px;
}

.loading-screen.active {
    display: flex;
}

/* LOADING MESSAGE */
.loading-message {
    font-size: clamp(22px, 6vw, 30px);
    font-weight: bold;
    color: #1ed760;
    text-align: center;
    margin-bottom: 30px;
}

/* PROGRESS BAR CONTAINER */
.progress-container {
    width: 100%;
    max-width: 350px;
    height: 12px;
    background: #333333;
    border-radius: 20px;
    overflow: hidden;
}

/* PROGRESS BAR */
.progress-bar {
    width: 0%;
    height: 100%;
    background: #1ed760;
    border-radius: 20px;
    transition: width 0.1s linear;
}

/* PROGRESS PERCENTAGE */
.progress-text {
    color: white;
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
}

/* LOADING SUBTITLE */
.loading-subtitle {
    color: #b3b3b3;
    font-size: 14px;
    margin-top: 12px;
    text-align: center;
}

/* SMALL ANDROID SCREENS */
@media screen and (max-width: 360px) {

    .app-icon {
        width: 38px;
        height: 38px;
    }

    .app-name {
        font-size: 21px;
    }

    main {
        padding: 15px;
    }

    .song-item {
        padding: 12px;
        gap: 10px;
    }

    .song-name {
        font-size: 13px;
    }
}

/* LARGE ANDROID SCREENS */
@media screen and (min-width: 600px) {

    main {
        padding: 25px;
    }

    .song-item {
        padding: 17px;
    }

    .song-name {
        font-size: 17px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header>

        <img
            src="Icon.jpg"
            class="app-icon"
            alt="SpotiMeer Icon"
        >

        <h1 class="app-name">
            SpotiMeer
        </h1>

    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- MUSIC TITLE, DURATION, SIZE AND DOWNLOAD -->
        <div class="music-item">

            <h2 class="music-title">
                Mushup Song by Ameer V 1.3.0
            </h2>

            <p class="music-duration">
                ⏱ Duration: 1 Hour 18 Minutes 21 Seconds
            </p>

            <p class="music-size">
                📁 File Size: 123.64 MB
            </p>

            <!-- DOWNLOAD BUTTON -->
            <button
                class="download-btn"
                id="downloadBtn"
                onclick="startDownload()"
            >
                ⬇ DOWNLOAD
            </button>

        </div>

        <!-- INCLUDED SONGS -->
        <h2 class="section-title">
            Included Songs
        </h2>

        <div class="song-list" id="songList"></div>

    </main>

</div>

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loadingScreen">

    <h2 class="loading-message">
        🖕💀🖐️ wait ka!
    </h2>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <p class="progress-text" id="progressText">
        0%
    </p>

    <p class="loading-subtitle">
        Please wait...
    </p>

</div>

<script>

/* MEDIAFIRE DOWNLOAD LINK */
const downloadLink =
"https://www.mediafire.com/file/clgtl6injot52kr/Song.mp3/file";

/* ALL 36 SONGS */
const songs = [
    "Phut hon duoyin",
    "Phut hon funk",
    "One upon a time duoyin",
    "Track Maker x illusionary date time",
    "Illusionary date time instrument",
    "Bass da da x illusionary date time",
    "Cupid english",
    "Cupid korean",
    "Turbo Slap Duoyin",
    "The recall of nine gate Duoyin",
    "Tayoki Duoyin",
    "Night dancer",
    "Kimi no tori",
    "Sunshine rainbow white pony",
    "Masiew x masiw",
    "See tinh",
    "PtrioStudio Lalai",
    "Sprite x GuyGege",
    "Mimimimi",
    "I love you much chinese",
    "Ai du em",
    "Bare minimum",
    "Kamin",
    "Nevada",
    "Baila lento",
    "Mandala",
    "Satisfya",
    "Sketchers",
    "Undress rehearsal hardtek",
    "Playdate",
    "Life geos on",
    "Wrap me in the plastic",
    "Fame",
    "Unforgettable",
    "Next door",
    "Every watching you"
];

/* DISPLAY SONGS */
const songList = document.getElementById("songList");

songs.forEach((song, index) => {

    const item = document.createElement("div");
    item.className = "song-item";

    const number = document.createElement("span");
    number.className = "song-number";
    number.textContent = index + 1;

    const name = document.createElement("span");
    name.className = "song-name";
    name.textContent = song;

    item.appendChild(number);
    item.appendChild(name);

    songList.appendChild(item);

});

/* DOWNLOAD LOADING SYSTEM */
let isLoading = false;

function startDownload() {

    if (isLoading) return;

    isLoading = true;

    const loadingScreen =
        document.getElementById("loadingScreen");

    const progressBar =
        document.getElementById("progressBar");

    const progressText =
        document.getElementById("progressText");

    const downloadBtn =
        document.getElementById("downloadBtn");

    let progress = 0;

    loadingScreen.classList.add("active");

    progressBar.style.width = "0%";
    progressText.textContent = "0%";

    downloadBtn.disabled = true;

    /* 0% TO 100% IN 5 SECONDS */
    const loadingInterval = setInterval(() => {

        progress++;

        progressBar.style.width = progress + "%";
        progressText.textContent = progress + "%";

        if (progress >= 100) {

            clearInterval(loadingInterval);

            progressText.textContent = "100%";

            setTimeout(() => {

                /* OPEN MEDIAFIRE */
                window.location.href = downloadLink;

                loadingScreen.classList.remove("active");

                downloadBtn.disabled = false;

                isLoading = false;

            }, 500);

        }

    }, 50);

}

</script>

</body>
</html>
